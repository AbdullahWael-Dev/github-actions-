name: Run Tests
run-name: ${{github.actor}} example-run-tests  
on:  
  workflow_dispatch

jobs:
  run-tests: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.3

      # name: install php and composer (IF YOU WANT)
        
      - name: Install project dependencies
        run: composer install -q

      - name: Prepare project
        run: | 
            cp .env.example .env
            php artisan key:generate

      - name: Run Tests
        env: 
            DB_CONNECTION: 'sqlite'
            DB_DATABASE: ':memory:'
        run: php artisan test --compact
